# ─────────────────────────────────────────────────────────────
# ローカル開発環境。R2 では frontend / backend も含めて「全部 Docker」で動かす方針
# （docs/07-local-dev.md）。ただし一度に全部は作らず、段階的に足していく:
#
#   Step 2 : db / minio だけ。まず疎通を確認する
#   Step 3 : backend（serversideup/php）を追加
#   Step 4 : frontend（next dev）を追加  ← いまここ
#
# 使い方:
#   docker compose up -d        # 起動
#   docker compose down         # 停止（データは volume に残る）
#   docker compose down -v      # データごと破棄
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ec2-db
    environment:
      # backend/.env の DB_DATABASE / DB_USERNAME / DB_PASSWORD と一致させること
      POSTGRES_DB: ec2
      POSTGRES_USER: ec2
      POSTGRES_PASSWORD: ec2secret
    ports:
      # ホスト側 5432 → コンテナ 5432。ホスト（TablePlus 等）から localhost:5432 で覗ける
      - "5432:5432"
    volumes:
      - ec2-pgdata:/var/lib/postgresql/data
    healthcheck:
      # backend コンテナが「DB が受付可能」になるまで待てるように
      test: ["CMD-SHELL", "pg_isready -U ec2 -d ec2"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO（S3 互換ストレージ）─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ec2-minio
    command: server /data --console-address ":9001"
    environment:
      # ルート資格情報。backend/.env と frontend/.env.local の AWS_* / BUCKET_* に使う
      # （ユーザー名は3文字以上、パスワードは8文字以上が MinIO の必須条件）
      MINIO_ROOT_USER: ec2
      MINIO_ROOT_PASSWORD: ec2secret
    ports:
      - "9000:9000"   # S3 API（Laravel / Next.js からのアクセス先）
      - "9001:9001"   # 管理コンソール（ブラウザで http://localhost:9001 ）
    volumes:
      - ec2-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── backend（Laravel / serversideup/php）────────────────────
  # nginx + php-fpm を同梱した本番向けイメージ。ローカルも本番も同じイメージを使う
  # （本番は docs/04 の薄い Dockerfile でコードを焼き込む。ローカルは ./backend をマウント）。
  backend:
    image: serversideup/php:8.4-fpm-nginx
    container_name: ec2-backend
    volumes:
      # ソースをマウントしてホットリロード（php-fpm はリクエストごとに読み直すので都度反映される）
      - ./backend:/var/www/html
    environment:
      # serversideup 側の運用フラグ（Laravel の .env ではなくコンテナ環境変数で渡す）
      SSL_MODE: "off"                 # 内部通信は http。TLS は本番で Railway エッジが終端
      PHP_OPCACHE_ENABLE: "0"         # dev はコード変更を即反映したいので opcache 無効
      AUTORUN_ENABLED: "false"        # dev は migrate 等を手動で叩く（本番は true にして自動実行）
    ports:
      # ホスト 8000 → コンテナ 8080（serversideup は非 root で 8080 をリッスン）。
      # BFF なので通常ブラウザからは使わないが、curl / Laravel Boost MCP 用に開けておく
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── frontend（Next.js / next dev）───────────────────────────
  # ブラウザが触れる唯一のサーバー（BFF）。ソースをマウントしてホットリロード。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ec2-frontend
    volumes:
      - ./frontend:/app
      # node_modules はホストと共有しない（OS 差・パフォーマンス対策）。名前付きボリュームに隔離
      - ec2-frontend-node_modules:/app/node_modules
    environment:
      # Mac の Docker Desktop はファイル変更検知が効かないことがあるので polling を有効化
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      # サーバー側（Route Handler / Server Component）から Laravel を呼ぶ先。コンテナ名で解決
      API_URL: "http://backend:8080"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      # /media プロキシ（app/media/[...key]/route.ts）が S3 互換バケットから画像を読むための資格情報。
      # ローカルは MinIO。backend/.env の AWS_* と資格情報自体は同じ（ec2 / ec2secret）
      BUCKET_ENDPOINT: "http://minio:9000"
      BUCKET_ACCESS_KEY_ID: "ec2"
      BUCKET_SECRET_ACCESS_KEY: "ec2secret"
      BUCKET_NAME: "ec2-media"
      BUCKET_REGION: "us-east-1"
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - minio

  # ── バケット初期化（使い捨て）─────────────────────────────
  # minio が healthy になったら 1 回だけ実行してバケットを作る。
  # 本番の Railway バケットは private なので、ここでも公開設定はしない
  # （Laravel / Next.js は資格情報を使ってアクセスする）。
  createbuckets:
    image: minio/mc:latest
    container_name: ec2-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ec2 ec2secret &&
      mc mb --ignore-existing local/ec2-media &&
      echo '✅ bucket ec2-media ready';
      "
    restart: "no"

# ── 永続ボリューム ─────────────────────────────────────────
volumes:
  ec2-pgdata:
  ec2-minio:
  ec2-frontend-node_modules:
